name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The same suite under several timezones at once: the world has a clock (days run from local midnight, bedtime), and a test that quietly depends
    # on the hour it runs at would pass for the author in the afternoon and fail for someone else at 2 am.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Kolkata, Pacific/Kiritimati, America/Chicago, Pacific/Pago_Pago, Europe/London]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --junitxml=junit.xml
      - if: failure()
        run: python scripts/annotate_failures.py junit.xml     # each failing test becomes an annotation: readable without the log

  image:
    # Proves the image builds; publishing is in image.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
